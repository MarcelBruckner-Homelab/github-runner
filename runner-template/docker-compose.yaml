# Template copied verbatim into runners/<name>/docker-compose.yaml by register.sh.
# All per-runner values come from the sibling .env file (docker compose native
# variable substitution) — this file itself never needs editing.
#
# Docker access: unlike the Gitea/act_runner setup, the GitHub Actions runner
# binary is the same one GitHub itself runs — it talks to Docker directly as
# its own process rather than spawning a separate "job container" with its own
# Docker client. So DOCKER_HOST here is all that's needed; there's no
# network/DNS workaround required for `services:` containers the way there is
# for act_runner.
services:
  dind:
    image: docker:27-dind
    container_name: github-dind-${RUNNER_NAME}
    hostname: dind-${RUNNER_NAME}
    restart: unless-stopped
    privileged: true
    command: ["dockerd", "--host=tcp://0.0.0.0:2375", "--tls=false", "--registry-mirror=http://registry-mirror:5000"]
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      # Same host directory, same path, as the runner's own mount below. A
      # job's compose file can bind-mount a relative path (e.g. `./report:/x`)
      # into a container it starts — Compose resolves that to an absolute
      # path on the *client* (this runner container) and sends it to dockerd
      # as-is, but dockerd resolves bind-mount sources on *its own*
      # filesystem (this dind container's). Without this mirrored mount,
      # dockerd bind-mounts an empty directory at that path instead of the
      # runner's actual checked-out workdir, so writes never make it back to
      # a later step reading the same path from the runner side.
      #
      # Must NOT be under /tmp: docker:27-dind mounts its own tmpfs over
      # /tmp during startup, which shadows anything bind-mounted under it at
      # container-creation time (verified — a mount at /tmp/runner/work is
      # silently hidden; the same mount at /runner/work is not).
      - ./data:/runner/work
    networks:
      - github_runner_network

  runner:
    # Set via register.sh --image (default: myoung34/github-runner:ubuntu-noble).
    # Not :latest (Ubuntu 20.04/Focal) — actions/setup-python doesn't publish
    # Python 3.14 builds for Focal, and noble matches the OS family GitHub's
    # own ubuntu-latest hosted runners use.
    image: ${RUNNER_IMAGE:-myoung34/github-runner:ubuntu-noble}
    container_name: github-runner-${RUNNER_NAME}
    hostname: runner-${RUNNER_NAME}
    restart: unless-stopped
    depends_on:
      dind:
        condition: service_started
    environment:
      ACCESS_TOKEN: ${ACCESS_TOKEN}
      RUNNER_SCOPE: ${RUNNER_SCOPE}
      ORG_NAME: ${ORG_NAME:-}
      REPO_URL: ${REPO_URL:-}
      RUNNER_NAME: ${RUNNER_NAME}
      RUNNER_GROUP: ${RUNNER_GROUP:-Default}
      LABELS: ${LABELS}
      # Not under /tmp — see the note on the dind service's volume above.
      RUNNER_WORKDIR: /runner/work
      DISABLE_AUTO_UPDATE: "true"
      START_DOCKER_SERVICE: "false"
      DOCKER_HOST: tcp://dind:2375
      # Must default to empty, not "false" — the image checks "-n $EPHEMERAL"
      # (set to anything = ephemeral), not the value.
      EPHEMERAL: ${EPHEMERAL:-}
    volumes:
      - ./data:/runner/work
    networks:
      - github_runner_network

networks:
  github_runner_network:
    external: true
